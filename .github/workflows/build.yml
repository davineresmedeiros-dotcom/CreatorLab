name: Build CreatorLab

on:
  # Builds only when manually requested from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    name: Build Android64 Geode mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreatorLab-Android64
          path: ${{ steps.build.outputs.build-output }}
